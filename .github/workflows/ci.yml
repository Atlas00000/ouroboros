name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (lint · test · drift · audit · image)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: ouroboros
          POSTGRES_PASSWORD: ouroboros
          POSTGRES_DB: ouroboros
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ouroboros -d ouroboros"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ouroboros:ouroboros@localhost:5432/ouroboros
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit

      - name: Ruff
        run: ruff check app tests

      - name: Migrate
        run: python -m alembic upgrade head

      - name: Pytest
        run: python -m pytest -q

      - name: Migration drift check
        run: python -m alembic check

      - name: pip-audit
        run: pip-audit --progress-spinner off || true
        # Non-blocking initially; tighten to fail-closed once baseline is clean

      - name: Build server image
        working-directory: .
        run: docker build -t ouroboros-server:ci ./server

  contracts:
    name: contracts (import)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -c "from contracts import AssetProfile, MarketState; print('ok')"
      - run: python -m contracts.export_jsonschema

  client-placeholder:
    name: client Dockerfile placeholder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build client image (placeholder)
        run: docker build -t ouroboros-client:ci ./client
