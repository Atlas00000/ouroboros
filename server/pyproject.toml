[project]
name = "ouroboros-server"
version = "0.1.0"
description = "Ouroboros asset-intelligence API and worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
  "sentry-sdk[fastapi]>=2.0",
  "redis>=5.0",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "httpx>=0.27",
  "MetaTrader5>=5.0.45; platform_system=='Windows'",
]

# Install shared contracts separately when needed:
#   pip install -e ../packages/contracts

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]
