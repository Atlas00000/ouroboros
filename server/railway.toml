# Railway — API service config-as-code.
#
# Full steps: ../DEPLOYMENT.md
#
# Dashboard / CLI:
#   Root Directory = repository root (so packages/contracts is in the build context)
#   Prefer repo-root railway.toml when using `railway up`
#
# Start command: use image CMD (shell-expanded PORT) — do not set bare `$PORT`.
# Worker: create a second service with startCommand `python -m app.scheduler`
# (see server/railway.worker.toml).

[build]
builder = "DOCKERFILE"
dockerfilePath = "server/Dockerfile"

[deploy]
releaseCommand = "python -m alembic upgrade head"
healthcheckPath = "/v1/health/live"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
