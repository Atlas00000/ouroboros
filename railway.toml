# Railway — API service (linked service: api)
# startCommand MUST use sh -c so ${PORT} expands (Railway does not expand bare $PORT).

[build]
builder = "DOCKERFILE"
dockerfilePath = "server/Dockerfile"

[deploy]
startCommand = "sh -c 'uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
releaseCommand = "python -m alembic upgrade head"
healthcheckPath = "/v1/health/live"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
